name: Build New API packages

on:
  workflow_dispatch:
    inputs:
      newapi_base_url:
        description: "New API relay base URL (e.g. https://new.ahei.asia)"
        required: false
        default: "https://new.ahei.asia"
      product_name:
        description: "Product display name baked into the binary"
        required: false
        default: "AHEIAPI"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
          - os: macos-latest
            target: aarch64-apple-darwin
            is_windows: false
          - os: macos-13
            target: x86_64-apple-darwin
            is_windows: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and archive (Windows)
        if: matrix.is_windows == 'true'
        shell: pwsh
        run: |
          .\scripts\build_cnapi_packages.ps1 `
            -NewApiBaseUrl "${{ github.event.inputs.newapi_base_url }}" `
            -ProductName "${{ github.event.inputs.product_name }}" `
            -Targets ${{ matrix.target }}

      - name: Build and archive (macOS)
        if: matrix.is_windows == 'false'
        shell: bash
        run: |
          export NEWAPI_BASE_URL="${{ github.event.inputs.newapi_base_url }}"
          export NEWAPI_PRODUCT_NAME="${{ github.event.inputs.product_name }}"
          ./scripts/build_cnapi_packages.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
