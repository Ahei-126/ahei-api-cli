name: Build New API packages

on:
  workflow_dispatch:
    inputs:
      newapi_base_url:
        description: "New API relay base URL (e.g. https://new.ahei.asia)"
        required: false
        default: "https://new.ahei.asia"
      product_name:
        description: "Product display name baked into the binary"
        required: false
        default: "AHEIAPI"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true
          - os: macos-latest
            target: aarch64-apple-darwin
            is_windows: false
          - os: macos-latest
            target: x86_64-apple-darwin
            is_windows: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build_cnapi_packages.ps1 `
            -NewApiBaseUrl "${{ github.event.inputs.newapi_base_url }}" `
            -ProductName "${{ github.event.inputs.product_name }}" `
            -Targets ${{ matrix.target }}

      - name: Build and archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          echo "event.base=[${{ github.event.inputs.newapi_base_url }}]"
          echo "event.product=[${{ github.event.inputs.product_name }}]"
          export NEWAPI_BASE_URL="${{ github.event.inputs.newapi_base_url }}"
          export NEWAPI_PRODUCT_NAME="${{ github.event.inputs.product_name }}"
          echo "==> invoking bash wrapper (avoids exec-bit requirement)"
          bash ./scripts/build_cnapi_packages.sh "${{ matrix.target }}"
          echo "==> build_cnapi_packages.sh exited with rc=$?"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
          name: AHEIAPI Codex CLI ${{ github.ref_name }}
